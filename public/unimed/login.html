<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesse sua área - Unimed Curitiba</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="public-header">
    <div class="header-inner">
      <a class="logo-box" href="index.html">
        <div class="nome">Unimed &#10047;</div>
        <div class="cidade">Curitiba</div>
      </a>

      <nav class="main-nav">
        <a href="#" onclick="return false">A Unimed
Curitiba</a>
        <a href="#" onclick="return false">Hospital e
maternidade</a>
        <a href="#" onclick="return false">Instituto</a>
        <a href="#" onclick="return false">Planos</a>
        <a href="#" onclick="return false">Empresas do
grupo</a>
        <a href="#" onclick="return false">Fique por
dentro</a>
        <a href="#" onclick="return false">Fale
Conosco</a>
      </nav>

      <div class="header-right">
        <a class="btn-entrar" href="area-trabalho.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg> Entrar</a>
        <button class="search-icon" title="Buscar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg></button>
      </div>
    </div>
  </header>

  <div class="breadcrumb">
    <div class="inner">
      <a href="index.html">Home</a>
      <span class="sep">&rsaquo;</span>
      <span class="current">Acesse sua área</span>
    </div>
  </div>

  <main>
    <div class="login-card">
      <h2>Selecione o tipo de login</h2>

      <div class="tiles">
        <button type="button" class="tile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1 1.2 2.1 1.8 3.5 1.8s2.5-.6 3.5-1.8"/><line x1="9" y1="9.5" x2="9.01" y2="9.5"/><line x1="15" y1="9.5" x2="15.01" y2="9.5"/></svg>Para você</button>
        <button type="button" class="tile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="7.5" width="18" height="13" rx="2"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5"/></svg>Para sua empresa</button>
        <!-- Médico Cooperado: fluxo trabalhado no protótipo -->
        <a class="tile" href="area-trabalho.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Médico Cooperado</a>
        <button type="button" class="tile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a13.5 13.5 0 0 1 0 18a13.5 13.5 0 0 1 0-18"/></svg>Sinapse</button>
        <button type="button" class="tile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c1.2-3.5 3.8-5 6.5-5s5.3 1.5 6.5 5"/><path d="M15.5 5.5a3.5 3.5 0 0 1 0 6.5"/><path d="M17.5 15.2c2 .7 3.3 2.2 4 4.8"/></svg>Outros</button>
      </div>

      <label for="codigo-unimed">Código Unimed:</label>
      <input id="codigo-unimed" type="text" />

      <div style="margin-top:14px">
        <label for="crm">CRM:</label>
        <input id="crm" type="text" placeholder="00000" />
      </div>

      <div class="consent">
        <input id="aceite" type="checkbox" checked />
        <label for="aceite" style="margin:0;font-weight:400">
          Eu li, estou ciente das condições de tratamento dos meus dados pessoais
          e dou consentimento, quando aplicável conforme descrito nesta
          <a href="#" onclick="return false">Política de Privacidade e Termos de Uso</a>
        </label>
      </div>

      <button class="btn full" id="btn-login" type="button">Entrar</button>
    </div>
  </main>

  <script>
    const aceite = document.getElementById("aceite")
    const btnLogin = document.getElementById("btn-login")
    aceite.addEventListener("change", () => (btnLogin.disabled = !aceite.checked))
    btnLogin.addEventListener("click", () => {
      if (!btnLogin.disabled) window.location.href = "area-trabalho.html"
    })
    // Tiles sem fluxo: apenas marcam a seleção
    document.querySelectorAll("button.tile").forEach((t) => {
      t.addEventListener("click", () => {
        document.querySelectorAll(".tile").forEach((x) => x.classList.remove("selected"))
        t.classList.add("selected")
      })
    })
  </script>
</body>
</html>
